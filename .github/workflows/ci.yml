name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # 화면 연기 시험 (점검 S40): 위에서 만든 dist를 vite preview로 띄워 Chromium으로 돈다
      - name: Playwright Chromium 설치
        working-directory: apps/web
        # 러너가 우분투 패키지(글꼴 등)를 받지 못하는 날이 있다. 그때는 시험을 돌리지도 못하고 멈추므로 브라우저만 받아 이어 간다
        run: |
          pnpm exec playwright install --with-deps chromium || {
            echo "::warning::시스템 패키지를 받지 못해 Chromium만 받습니다 (글꼴이 달라 화면 시험 결과가 다를 수 있음)"
            pnpm exec playwright install chromium
          }
      - name: 화면 연기 시험 (e2e)
        run: pnpm --filter @mmlce/web e2e
      - name: 실패한 시험 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/test-results/
          retention-days: 7
